<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="referrer" content="no-referrer"><meta name="description" content="PRStK Lab 本機研究工作台：建立研究案、記錄決策並匯出備份。"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://jpsohtutyaondeyvcjls.supabase.co; form-action 'self'; frame-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"><link rel="canonical" href="https://hanjhou2000716.github.io/prstk-lab/workbench/"><title>工作台｜PRStK Lab</title><link rel="stylesheet" href="../assets/styles.css"></head><body class="min-h-screen bg-muji-bg text-muji-text"><main class="mx-auto max-w-5xl px-5 py-8 sm:px-8"><a href="../" class="text-sm text-muji-brand hover:text-orange">← 回到首頁</a><header class="mt-8"><p class="text-xs tracking-[0.2em] text-muji-muted">PRSTK LAB · WORKBENCH</p><h1 class="mt-2 text-3xl font-semibold">我的研究工作台</h1><p class="mt-3 max-w-2xl text-sm leading-7 text-muji-muted">研究資料只保存在這個瀏覽器。你可以建立研究案、記錄決策，並隨時匯出備份。</p></header><section class="mt-6 flex flex-wrap gap-2" aria-label="研究資料操作"><button id="export-json" type="button" class="workbench-action">匯出 JSON</button><button id="export-markdown" type="button" class="workbench-action">匯出 Markdown</button><button id="export-csv" type="button" class="workbench-action">匯出 CSV</button><button id="import-data" type="button" class="workbench-action">匯入備份</button><input id="import-file" type="file" accept="application/json" hidden></section><div id="workbench-status" class="mt-4 min-h-6 text-sm text-muji-muted" role="status" aria-live="polite"></div><div class="mt-4 grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)]"><section class="rounded-3xl border border-muji-border bg-white/85 p-5 shadow-sm" aria-labelledby="project-form-title"><div class="flex items-center justify-between gap-3"><h2 id="project-form-title" class="text-lg font-semibold">建立研究案</h2><button id="reset-form" type="button" class="text-xs text-muji-muted hover:text-orange">清空表單</button></div><form id="project-form" class="mt-5 space-y-3"><label class="workbench-label">研究模板<select id="template" class="workbench-input"><option value="">自訂研究案</option><option value="company">個股研究</option><option value="etf">ETF 比較</option><option value="strategy">策略回測</option><option value="allocation">資產配置</option><option value="event">市場事件</option><option value="risk">風險評估</option><option value="review">投資事後檢討</option></select></label><label class="workbench-label">研究案名稱<input id="title" class="workbench-input" required placeholder="例如：AI 供應鏈研究"></label><label class="workbench-label">研究標的<input id="target" class="workbench-input" placeholder="股票、ETF 或市場主題"></label><label class="workbench-label">研究問題<textarea id="question" class="workbench-input" rows="2" placeholder="這次要回答什麼問題？"></textarea></label><label class="workbench-label">投資假設<textarea id="hypothesis" class="workbench-input" rows="2"></textarea></label><label class="workbench-label">證據與來源<textarea id="evidence" class="workbench-input" rows="2" placeholder="一行一項，可貼上原始連結"></textarea></label><label class="workbench-label">主要風險與失效條件<textarea id="risks" class="workbench-input" rows="2"></textarea></label><div class="grid gap-3 sm:grid-cols-2"><label class="workbench-label">決策<select id="decision" class="workbench-input"><option value="觀望">觀望</option><option value="買入">買入</option><option value="賣出">賣出</option></select></label><label class="workbench-label">信心程度<select id="confidence" class="workbench-input"><option value="尚未評估">尚未評估</option><option value="低">低</option><option value="中">中</option><option value="高">高</option></select></label></div><div class="grid gap-3 sm:grid-cols-2"><label class="workbench-label">狀態<select id="status" class="workbench-input"><option value="draft">草稿</option><option value="active">進行中</option><option value="completed">已完成</option><option value="archived">已封存</option></select></label><label class="workbench-label">下次檢查日期<input id="nextReviewDate" class="workbench-input" type="date"></label></div><button class="w-full rounded-2xl bg-muji-brand px-4 py-3 text-sm font-medium text-white transition hover:bg-[#384a54]" type="submit">儲存研究案</button></form></section><section aria-labelledby="project-list-title"><div class="flex items-center justify-between"><h2 id="project-list-title" class="text-lg font-semibold">研究案清單</h2><span id="project-count" class="text-xs text-muji-muted">0 個研究案</span></div><div id="project-list" class="mt-4 space-y-3"></div><div id="project-empty" class="rounded-2xl border border-dashed border-muji-border bg-white/55 p-8 text-center text-sm leading-7 text-muji-muted">尚未建立研究案。從左側模板開始，先寫下你的研究問題。</div></section></div><section class="mt-6 rounded-3xl border border-muji-border bg-white/75 p-5 shadow-sm" aria-labelledby="sync-title"><div class="flex flex-wrap items-start justify-between gap-3"><div><h2 id="sync-title" class="text-lg font-semibold">雲端同步</h2><p id="sync-status" class="mt-2 text-sm leading-6 text-muji-muted" role="status" aria-live="polite">目前為本機模式；登入後可同步到 Supabase。</p></div><a href="../account/" class="workbench-action">登入／設定</a></div><div class="mt-4 flex flex-wrap gap-2"><button id="sync-pull" type="button" class="workbench-action" disabled>從雲端載入</button><button id="sync-push" type="button" class="workbench-action" disabled>同步到雲端</button><button id="sync-sign-out" type="button" class="workbench-action" hidden>登出</button></div></section><p class="mt-8 border-t border-muji-border pt-4 text-xs leading-6 text-muji-muted">隱私提醒：未登入時研究案只保存在本機；登入後只有在你按下同步按鈕時才會傳送到 Supabase。清除瀏覽器資料前請先匯出 JSON 備份。</p></main><script type="module" src="/prstk-lab/_astro/index.astro_astro_type_script_index_0_lang.ThEgEbRI.js"></script></body></html>
