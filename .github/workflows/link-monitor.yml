name: PRStK Lab external link monitor

on:
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check external tools
        id: links
        continue-on-error: true
        run: node scripts/check-links.cjs --output=link-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: link-report.json
      - name: Open or update issue for failures
        if: steps.links.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(fs.readFileSync('link-report.json', 'utf8'));
            const title = 'External tool links need verification';
            const body = [
              `Automated check: ${report.generatedAt}`,
              '',
              ...report.failures.map(item => `- **${item.name}** (${item.slug}) — ${item.url} — ${item.status ?? item.error}`),
              '',
              'Please verify the service before changing its status in `src/data/tools.json`.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'external-link-monitor'
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['external-link-monitor'] });
            }
